name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui run build
      - run: npm --prefix ui test

  search-performance:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run search latency gate
        # pipefail matters: without it the pipeline exits with tee's status and
        # a failed assertion would silently pass the job.
        shell: bash
        run: |
          set -o pipefail
          npm run benchmark:search -- --assert --explain-output search-plans.json | tee search-latency.json
      - uses: actions/upload-artifact@v4
        # Upload on failure too — the numbers are what explain a failed gate.
        if: always()
        with:
          name: search-latency
          path: |
            search-latency.json
            search-plans.json

  search-quality:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run search relevance gate
        # Keep the JSON report when an assertion fails so the artifact shows
        # which query regressed instead of only showing the thrown error.
        shell: bash
        run: |
          set -o pipefail
          npm run benchmark:quality -- --assert | tee search-quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-quality
          path: search-quality.json
