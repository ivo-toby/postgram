server {
  listen 3000;

  # API traffic goes to the `postgram_mcp` upstream, which is generated at
  # container start by /docker-entrypoint.d/40-postgram-mcp-upstream.sh
  # (ui/docker-entrypoint.d/). On Docker's embedded DNS it re-resolves
  # mcp-server every 10s, so recreating mcp-server (new IP) no longer leaves
  # this container sending traffic to the old address. On any other runtime
  # it resolves once at startup, exactly as a literal proxy_pass would.
  # No URI part on proxy_pass: the original request URI is passed unchanged.

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://postgram_mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /admin/api/ {
    proxy_pass http://postgram_mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass http://postgram_mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
